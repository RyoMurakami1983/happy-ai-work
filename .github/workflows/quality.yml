name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - run: uv run --script scripts/validate_quality.py
      - run: python scripts/validate_constitution.py --check-remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
