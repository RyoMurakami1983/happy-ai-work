<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__ | 画面試作</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f5; --surface: #fff; --ink: #263238;
      --muted: #52616a; --line: #cbd2d8; --primary: #1976d2;
      --info: #e3f2fd; --success: #e8f5e9; --warning: #fff3e0;
      --error: #fdecea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    .shell { max-width: 960px; margin: 0 auto; padding: 24px; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar .shell { padding-top: 14px; padding-bottom: 14px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--info); color: #0d47a1; font-weight: 700; }
    h1 { margin: 12px 0 4px; font-size: 1.6rem; }
    h2 { margin: 0 0 12px; font-size: 1.2rem; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .notice, .panel, .status { border: 1px solid var(--line); border-radius: 5px; padding: 18px; background: var(--surface); }
    .notice { margin-bottom: 18px; background: var(--info); }
    .notice p:last-child, .status p:last-child { margin-bottom: 0; }
    .panel + .panel { margin-top: 18px; }
    .field { max-width: 430px; margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin-bottom: 5px; }
    input { display: block; width: 100%; min-height: 42px; padding: 7px 10px; border: 1px solid #687782; border-radius: 4px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .button { min-height: 42px; padding: 8px 14px; border: 1px solid var(--primary); border-radius: 4px; background: var(--surface); color: #0d47a1; font-weight: 700; }
    .button.primary { background: var(--primary); color: #fff; }
    .button:hover { filter: brightness(.94); }
    .button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 16px; }
    .status[data-state="running"] { background: var(--info); }
    .status[data-state="success"] { background: var(--success); }
    .status[data-state="stale"] { background: var(--warning); }
    .status[data-state="error"] { background: var(--error); }
    .state-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (max-width: 600px) { .shell { padding: 16px; } .actions .button { width: 100%; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell"><span class="tag">画面試作</span><h1>__TITLE__</h1></div>
  </header>
  <main class="shell">
    <div class="notice" role="note">
      <strong>操作確認用の試作です。</strong>
      <p>入力は送信・保存しません。下の結果は固定の表示例で、入力から計算したものではありません。</p>
    </div>
    <section class="panel" aria-labelledby="task-title">
      <h2 id="task-title">主操作の例</h2>
      <p class="muted">この見出し・項目・操作を案件のUI設計に合わせて置き換えてください。</p>
      <div class="field">
        <label for="sample-input">確認する条件（例）</label>
        <input id="sample-input" type="text" value="表示例" data-prototype-input>
      </div>
      <div class="actions">
        <button class="button primary" id="demo-run" type="button">操作を試す</button>
      </div>
      <div class="status" id="demo-status" data-state="idle" role="status" aria-live="polite">
        <strong id="status-title">未実行</strong>
        <p id="status-detail">模擬操作を試せます。</p>
      </div>
    </section>
    <section class="panel" aria-labelledby="states-title">
      <h2 id="states-title">表示状態の確認</h2>
      <p class="muted">各ボタンは固定の表示例を切り替えます。対象の状態へ置き換えてください。</p>
      <div class="state-controls">
        <button class="button" type="button" data-demo-state="idle">初期</button>
        <button class="button" type="button" data-demo-state="running">処理中</button>
        <button class="button" type="button" data-demo-state="success">成功</button>
        <button class="button" type="button" data-demo-state="error">エラー</button>
      </div>
    </section>
  </main>
  <script>
    'use strict';
    const statusMessages = {
      idle: ['未実行', '模擬操作を試せます。'],
      running: ['処理中（模擬）', '実際の処理は行っていません。'],
      success: ['成功（固定の表示例）', '現在の入力から計算した結果ではありません。'],
      error: ['エラー（固定の表示例）', '入力を確認して再試行する場面を示します。'],
      stale: ['入力が変わりました', '前の表示は現在の入力に対応しません。もう一度操作してください。']
    };
    const input = document.getElementById('sample-input');
    const runButton = document.getElementById('demo-run');
    const status = document.getElementById('demo-status');
    let runId = 0;
    function showState(name) {
      const message = statusMessages[name];
      status.dataset.state = name;
      document.getElementById('status-title').textContent = message[0];
      document.getElementById('status-detail').textContent = message[1];
      runButton.disabled = name === 'running';
    }
    input.addEventListener('input', () => {
      runId += 1;
      showState('stale');
    });
    runButton.addEventListener('click', () => {
      if (!input.value.trim()) {
        runId += 1;
        showState('error');
        input.focus();
        return;
      }
      const currentRun = ++runId;
      showState('running');
      window.setTimeout(() => {
        if (currentRun === runId) showState('success');
      }, 700);
    });
    document.querySelectorAll('[data-demo-state]').forEach(button => {
      button.addEventListener('click', () => {
        runId += 1;
        showState(button.dataset.demoState);
      });
    });
  </script>
</body>
</html>
