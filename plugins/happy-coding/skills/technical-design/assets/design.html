<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>$TITLE</title><style>
:root{--blue:#245eac;--ink:#223348;--muted:#596b7f;--border:#cfd8e3;--soft:#edf3fa;--bg:#f4f6f8}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.75 "Yu Gothic UI",Meiryo,system-ui,sans-serif}a{color:#215da8}button{font:inherit;cursor:pointer}header{background:#fff;border-bottom:1px solid var(--border);padding:34px 24px 24px}.hero{max-width:1160px;margin:auto}h1{font-size:clamp(25px,3vw,37px);line-height:1.4;margin:8px 0 12px}h2{font-size:25px;line-height:1.5;margin:4px 0 12px}h3{font-size:21px;margin:25px 0 10px}h4{font-size:18px;margin:20px 0 8px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin:0}.badge{display:inline-block;background:#e8f1fb;color:#245c99;padding:3px 10px;border-radius:4px;font-size:13px;margin:0 5px 5px 0}.lead{font-size:18px;max-width:930px;color:var(--muted)}nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border)}nav div{max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:7px;padding:10px 16px}nav a{display:block;padding:4px 12px;text-decoration:none;border-radius:4px;color:#334e6e;font-size:14px}nav a:hover,nav a:focus{background:var(--soft)}main{max-width:1200px;margin:auto;padding:24px 18px 60px}.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:28px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{background:#f2f6fc;border:1px solid #d5e1ef;padding:18px;border-radius:6px}.tile h3{margin:0 0 8px;font-size:18px}.tile p{margin:0}.notice{border-left:4px solid #dca34b;background:#fff8eb;padding:16px 20px;margin-top:20px}.notice p{margin:0}.diagram-tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px}.zoom{border:1px solid #b7c8db;background:#edf4fd;color:#245c99;border-radius:4px;padding:5px 12px}.diagram-scroll{overflow:auto;margin-top:18px;border:1px solid #e2e8ef;background:white}.diagram-scroll svg{display:block;width:100%;min-width:900px;height:auto}.diagram-scroll.expanded svg{width:140%;min-width:1250px}.caption{color:var(--muted);border-left:3px solid #b4cbe3;padding:5px 14px;font-size:15px;margin:18px 0 0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}th,td{border:1px solid var(--border);padding:10px 12px;text-align:left;vertical-align:top}th{background:#edf3fa;white-space:nowrap}td{min-width:100px}code{font-family:Consolas,"Yu Gothic",monospace;font-size:.9em;overflow-wrap:anywhere;background:#eff3f8;padding:2px 4px;border-radius:3px}pre{overflow:auto;background:#f4f7fa;border:1px solid var(--border);padding:15px}pre code{background:transparent;padding:0;white-space:pre}details{border-top:1px solid var(--border);padding:14px 0}summary{font-size:19px;font-weight:700;cursor:pointer;color:#285681}details>div{margin-top:18px}ul,ol{padding-left:26px}li{margin:5px 0}.references{display:flex;gap:14px;flex-wrap:wrap}footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 30px}:focus-visible{outline:3px solid #5d8ccc;outline-offset:3px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:20px 16px}main{padding:18px 10px}nav a{padding:3px 7px;font-size:13px}.lead{font-size:16px}}@media print{nav,.diagram-tools{display:none}.card{break-inside:avoid;padding:18px;margin-bottom:18px}.diagram-scroll svg{min-width:0}.card{border:0}body{background:white}main{max-width:none;padding:0}details{display:block}}

@media print{details>div{display:block!important}header{padding:15px}a{color:#223348;text-decoration:none}.diagram-scroll,.table-wrap{overflow:visible}.diagram-scroll svg,.diagram-scroll.expanded svg{width:100%;min-width:0;max-width:100%}}
</style></head><body><header><div class="hero"><p class="eyebrow">$LABEL</p><h1>$TITLE</h1><span class="badge">$DATE</span><span class="badge">$REVISION</span><span class="badge">$STATUS</span><p class="lead">$SUBTITLE</p></div></header><nav aria-label="設計書の目次"><div>$NAV</div></nav><main>$MAIN</main><footer>$FOOTER</footer><script>
const nav=document.querySelector('nav');
const updateScrollOffset=()=>{document.documentElement.style.scrollPaddingTop=(nav.getBoundingClientRect().height+16)+'px';};
new ResizeObserver(updateScrollOffset).observe(nav);
updateScrollOffset();
document.querySelectorAll('.zoom').forEach(button=>button.addEventListener('click',()=>{const panel=button.closest('section').querySelector('.diagram-scroll');const expanded=panel.classList.toggle('expanded');button.setAttribute('aria-pressed',String(expanded));button.textContent=expanded?'通常サイズに戻す':'図を拡大';}));
function revealAnchor(){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const target=document.getElementById(id);if(!target)return;let parent=target.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}target.scrollIntoView();}
window.addEventListener('hashchange',revealAnchor);
if(location.hash)revealAnchor();
const restore=new Map();
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(detail=>{restore.set(detail,detail.open);detail.open=true;}));
window.addEventListener('afterprint',()=>{restore.forEach((open,detail)=>{detail.open=open;});restore.clear();});
</script></body></html>
